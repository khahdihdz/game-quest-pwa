name: Deploy Empire Builder 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f game.js
          test -f manifest.webmanifest
          test -f sw.js
          node --check app.js
          node --check --input-type=module < game.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'Empire Builder 3D' index.html
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
