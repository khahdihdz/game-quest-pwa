name: Deploy HOTEL EMPIRE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game files
        run: |
          set -e
          test -s index.html
          test -s game.js
          test -s style.css
          test -s manifest.webmanifest
          test -s sw.js
          node --check game.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest OK')"
          ! grep -Eqi 'bootstrap|react|vue|angular|three\.js|phaser|unpkg\.com|jsdelivr\.net|cdnjs\.cloudflare\.com|fonts\.googleapis\.com' index.html game.js style.css
          ! grep -Eqi '<img|<audio|<video' index.html
          grep -q 'HOTEL EMPIRE' index.html
          grep -q 'localStorage' game.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
